# Applies src/data/gifts.ts to production Firestore: adds new gifts, refreshes names and build
# notes, and removes retired gifts that nobody has won (scripts/seed-gifts.mjs --prune).
# Run by hand after changing the gift list. Needs the repository secret FIREBASE_SERVICE_ACCOUNT.
name: Seed gifts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-gifts
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (runtime dependencies only)
        run: npm ci --omit=dev

      - name: Check configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is missing"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Seed gifts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: node scripts/seed-gifts.mjs --prune

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
